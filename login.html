<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - MIBER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <header class="site-header">
    <a class="logo" href="index.html" aria-label="MIBER, beranda">MIBER<span>.</span></a>
    <a class="back-link" href="index.html">← Kembali ke beranda</a>
  </header>

  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <p class="eyebrow">SELAMAT DATANG KEMBALI</p>
      <h1 id="login-title">Masuk ke MIBER</h1>
      <p class="login-intro">Masuk untuk melanjutkan belanja lap microfiber pilihanmu.</p>
      <form id="login-form" action="#" method="get" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="nama@email.com" autocomplete="email" required aria-describedby="email-error">
        <p class="error" id="email-error" aria-live="polite"></p>

        <label for="password">Kata sandi</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" placeholder="Masukkan kata sandi (min. 6 karakter)" autocomplete="current-password" required aria-describedby="password-error">
          <button type="button" class="show-btn" id="toggle-password" aria-label="Tampilkan kata sandi" aria-pressed="false">
            <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <p class="error" id="password-error" aria-live="polite"></p>

        <button class="button login-button" type="submit">Masuk</button>
        <p class="success" id="login-success" aria-live="polite" hidden></p>
      </form>
      <p class="signup-note">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
    </section>
  </main>

  <footer class="site-footer login-footer">
    <a class="logo" href="index.html">MIBER<span>.</span></a>
    <p>Lap microfiber untuk keseharian.</p>
  </footer>
  <button id="backToTop" type="button" aria-label="Kembali ke atas">↑</button>
  <script src="script.js" defer></script>
</body>
</html>
